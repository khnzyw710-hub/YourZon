name: Fetch Instagram Reel
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-reel.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: pip install yt-dlp

      - name: Download
        run: |
          mkdir -p downloads
          yt-dlp --no-check-certificates -o "downloads/reel.%(ext)s" \
            "https://www.instagram.com/reel/DbqhPsiR1RU/" 2>&1 || true
          if ! ls downloads/reel.* 1>/dev/null 2>&1; then
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              "https://www.instagram.com/reel/DbqhPsiR1RU/embed/" -o downloads/embed.html
            VIDEO_URL=$(grep -oP '"video_url"\s*:\s*"\K[^"]+' downloads/embed.html 2>/dev/null | head -1 | sed 's/\\u0026/\&/g')
            if [ -n "$VIDEO_URL" ]; then
              curl -sL -o downloads/reel.mp4 "$VIDEO_URL"
            fi
          fi
          ls -la downloads/

      - name: Push to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/instagram-reel-analysis-c3udhq
          git checkout claude/instagram-reel-analysis-c3udhq
          cp downloads/reel.mp4 ./reel_video.mp4 2>/dev/null || true
          git add reel_video.mp4 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new files to commit"
          else
            git commit -m "Add downloaded Instagram reel video"
            git push origin claude/instagram-reel-analysis-c3udhq
            echo "Video pushed successfully!"
          fi
